name: 🐛 Bug Report
description: Report a broken link, typo, or rendering issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: e.g. docs/professional-cloud-architect.html
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
